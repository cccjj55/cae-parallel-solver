<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="CG solve time across CPU, GPU with host round trips, and GPU with a device-resident loop">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">CG solve time: the schedule mattered more than the GPU</text>
  <text x="24" y="47" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">same matrix · tol 1e-10 · lower is better · 159k DOF (571 iters) and 638k DOF (1098 iters)</text>

  <!-- axis -->
  <line x1="80" y1="270" x2="720" y2="270" stroke="#e2e8f0"/>

  <!-- 159k group -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="120" y="205" width="56" height="65" fill="#64748b"/>
    <text x="148" y="197" font-size="11" text-anchor="middle" fill="#334155">65 ms</text>
    <text x="148" y="288" font-size="10" text-anchor="middle" fill="#475569">CPU 12T</text>

    <rect x="184" y="123" width="56" height="147" fill="#b91c1c"/>
    <text x="212" y="115" font-size="11" text-anchor="middle" fill="#b91c1c">147 ms</text>
    <text x="212" y="288" font-size="10" text-anchor="middle" fill="#b91c1c">GPU v1</text>
    <text x="212" y="302" font-size="9" text-anchor="middle" fill="#94a3b8">0.44×</text>

    <rect x="248" y="214" width="56" height="56" fill="#0f766e"/>
    <text x="276" y="206" font-size="11" text-anchor="middle" fill="#0f766e">56 ms</text>
    <text x="276" y="288" font-size="10" text-anchor="middle" fill="#0f766e">GPU v2</text>
    <text x="276" y="302" font-size="9" text-anchor="middle" fill="#0f766e">1.15×</text>

    <text x="360" y="240" font-size="11" fill="#475569">159k DOF</text>
  </g>

  <!-- 638k group -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="470" y="88" width="56" height="182" fill="#64748b"/>
    <text x="498" y="80" font-size="11" text-anchor="middle" fill="#334155">962 ms</text>
    <text x="498" y="288" font-size="10" text-anchor="middle" fill="#475569">CPU 12T</text>

    <rect x="534" y="182" width="56" height="88" fill="#b91c1c"/>
    <text x="562" y="174" font-size="11" text-anchor="middle" fill="#b91c1c">465 ms</text>
    <text x="562" y="288" font-size="10" text-anchor="middle" fill="#b91c1c">GPU v1</text>
    <text x="562" y="302" font-size="9" text-anchor="middle" fill="#94a3b8">2.07×</text>

    <rect x="598" y="207" width="56" height="63" fill="#0f766e"/>
    <text x="626" y="199" font-size="11" text-anchor="middle" fill="#0f766e">331 ms</text>
    <text x="626" y="288" font-size="10" text-anchor="middle" fill="#0f766e">GPU v2</text>
    <text x="626" y="302" font-size="9" text-anchor="middle" fill="#0f766e">2.91×</text>

    <text x="668" y="240" font-size="11" fill="#475569">638k DOF</text>
  </g>

  <text x="24" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">v1 = three dot products each synchronising with the host · v2 = reductions and scalars stay on the device, residual checked every 20 iterations</text>
</svg>
