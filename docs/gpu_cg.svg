<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Conjugate gradient solve time: CPU 12 threads versus GPU, and sustained SpMV bandwidth decay">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">End-to-end CG solve: CPU 12 threads vs GPU</text>
  <text x="24" y="47" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">same CSR matrix · tol 1e-10 · 571 iters (nx=400) / 1098 iters (nx=800)</text>

  <!-- panel 1: solve time -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="24" y="78" font-size="11" fill="#475569">solve time (lower is better)</text>
    <!-- axis -->
    <line x1="70" y1="250" x2="400" y2="250" stroke="#e2e8f0"/>

    <!-- nx=400 group -->
    <rect x="96" y="196" width="52" height="54" fill="#64748b"/>
    <text x="122" y="188" font-size="10" text-anchor="middle" fill="#334155">65 ms</text>
    <text x="122" y="266" font-size="11" text-anchor="middle" fill="#475569">CPU</text>

    <rect x="158" y="128" width="52" height="122" fill="#b91c1c"/>
    <text x="184" y="120" font-size="10" text-anchor="middle" fill="#b91c1c">147 ms</text>
    <text x="184" y="266" font-size="11" text-anchor="middle" fill="#b91c1c">GPU 0.44×</text>
    <text x="160" y="286" font-size="10" fill="#94a3b8">nx=400 (159k DOF)</text>

    <!-- nx=800 group -->
    <rect x="266" y="80" width="52" height="170" fill="#64748b"/>
    <text x="292" y="72" font-size="10" text-anchor="middle" fill="#334155">962 ms</text>
    <text x="292" y="266" font-size="11" text-anchor="middle" fill="#475569">CPU</text>

    <rect x="328" y="168" width="52" height="82" fill="#0f766e"/>
    <text x="354" y="160" font-size="10" text-anchor="middle" fill="#0f766e">465 ms</text>
    <text x="354" y="266" font-size="11" text-anchor="middle" fill="#0f766e">GPU 2.07×</text>
    <text x="330" y="286" font-size="10" fill="#94a3b8">nx=800 (638k DOF)</text>
  </g>

  <!-- panel 2: throttling -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="450" y="78" font-size="11" fill="#475569">sustained SpMV bandwidth (nx=800, one kernel, repeated)</text>
    <line x1="450" y1="250" x2="736" y2="250" stroke="#e2e8f0"/>
    <line x1="450" y1="110" x2="450" y2="250" stroke="#e2e8f0"/>

    <polyline points="450,110 560,142 670,232 736,244" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <circle cx="450" cy="110" r="4" fill="#0f766e"/>
    <circle cx="560" cy="142" r="4" fill="#0f766e"/>
    <circle cx="670" cy="232" r="4" fill="#b91c1c"/>
    <circle cx="736" cy="244" r="4" fill="#b91c1c"/>

    <text x="450" y="102" font-size="10" fill="#0f766e">392.9 GB/s</text>
    <text x="540" y="134" font-size="10" fill="#0f766e">354.4</text>
    <text x="640" y="222" font-size="10" fill="#b91c1c">192.8</text>

    <text x="450" y="266" font-size="10" fill="#475569">30 iters</text>
    <text x="540" y="266" font-size="10" fill="#475569">1,098</text>
    <text x="640" y="266" font-size="10" fill="#475569">3,000</text>
    <text x="450" y="288" font-size="10" fill="#94a3b8">a laptop GPU does not hold its burst bandwidth</text>
  </g>
</svg>
